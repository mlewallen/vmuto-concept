# Netlify config — static site, no build step.
# Connect the repo in Netlify and leave the UI build settings empty; this file supplies them.

[build]
  publish = "."       # index.html lives at the repo root
  command = ""        # nothing to build

# Routing is hash-based (#app, #app/book, …), so no SPA redirect rules are needed.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Robots-Tag = "noindex, nofollow"   # concept site: keep it out of search results

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
